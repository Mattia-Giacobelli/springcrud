<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- custom css -->
    <link rel="stylesheet" th:href="@{/styles/style.css}">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Accesso negato</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid gap-5">
                <a class="navbar-brand" href="#">Azienda</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/employees">Dipendenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects">Progetti</a>
                        </li>

                    </ul>
                </div>
            </div>

            <div class="d-flex justify-content-end me-4">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse navbar-dark" id="navbarSupportedContent">
                    <!-- Right Side Of Navbar -->
                    <ul class="navbar-nav navbar-dark bg-dark ml-auto">
                        <!-- Authentication Links -->

                        <!-- SE L'UTENTE NON È AUTENTICATO (Corrisponde a @guest) -->
                        <th:block sec:authorize="!isAuthenticated()">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/login}">Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/register}">Register</a>
                            </li>
                        </th:block>

                        <!-- SE L'UTENTE È AUTENTICATO (Corrisponde a @else) -->
                        <th:block sec:authorize="isAuthenticated()">
                            <li class="nav-item dropdown">
                                <a id="navbarDropdown" class="nav-link dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <span sec:authentication="name">Username</span>
                                </a>

                                <div class="dropdown-menu dropdown-menu-dark dropdown-menu-right"
                                    aria-labelledby="navbarDropdown">
                                    <form id="logout-form" th:action="@{/logout}" method="POST">
                                        <button class="btn btn-dark" type="submit">
                                            Logout
                                        </button>
                                    </form>
                                </div>
                            </li>
                        </th:block>

                    </ul>
                </div>
            </div>

        </nav>

    </header>

    <main>
        <div class="container">
            <div class="denied-msg">
                <div class="text-center">
                    <h1 class="text-danger">Accesso negato</h1>
                    <p th:text="${#authentication?.name}">utente</p>
                    <p>Non hai i permessi per accedere a questa pagina.</p>
                    <a class="btn btn-primary" href="/login">Torna al login</a>
                </div>
            </div>
        </div>
    </main>


    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
