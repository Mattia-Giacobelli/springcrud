<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Form progetto</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid gap-5">
                <a class="navbar-brand" href="#">Azienda</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects">Dipendenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects">Progetti</a>
                        </li>

                    </ul>
                </div>
            </div>

            <div class="d-flex justify-content-end me-4">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse navbar-dark" id="navbarSupportedContent">
                    <!-- Right Side Of Navbar -->
                    <ul class="navbar-nav navbar-dark bg-dark ml-auto">
                        <!-- Authentication Links -->

                        <!-- SE L'UTENTE NON È AUTENTICATO (Corrisponde a @guest) -->
                        <th:block sec:authorize="!isAuthenticated()">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/login}">Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/register}">Register</a>
                            </li>
                        </th:block>

                        <!-- SE L'UTENTE È AUTENTICATO (Corrisponde a @else) -->
                        <th:block sec:authorize="isAuthenticated()">
                            <li class="nav-item dropdown">
                                <a id="navbarDropdown" class="nav-link dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <span sec:authentication="name">Username</span>
                                </a>

                                <div class="dropdown-menu dropdown-menu-dark dropdown-menu-right"
                                    aria-labelledby="navbarDropdown">
                                    <a class="btn btn-dark" th:href="@{/user/profile}">
                                        <span>Profilo</span>
                                    </a>
                                    <form id="logout-form" th:action="@{/logout}" method="POST">
                                        <button class="btn btn-dark" type="submit">
                                            Logout
                                        </button>
                                    </form>
                                </div>
                            </li>
                        </th:block>

                    </ul>
                </div>
            </div>

        </nav>

    </header>

    <main>

        <div class="container">

            <h1 th:text="${project.id == null ? 'Aggiungi progetto' : 'Modifica progetto'}">

            </h1>

            <form th:method="${project.id == null} ? 'post' : 'put'"
                th:action="@{${project.id == null} ? '/projects/create' : '/projects/' + ${project.id}}"
                th:object="${project}">

                <!-- <input type="hidden" th:field="*{id}" /> -->

                <div class="mb-3">
                    <label for="name" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il nome del progetto">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="mb-3">
                    <label for="clientName" class="form-label">Nome Cliente</label>
                    <input type="text" class="form-control" id="clientName" th:field="*{clientName}"
                        th:classappend="${#fields.hasErrors('clientName')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il nome del cliente">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('clientName')}"
                        th:errors="*{clientName}"></span>
                </div>

                <div class="mb-3">
                    <label for="budget" class="form-label">Budget</label>
                    <input type="number" class="form-control" id="budget" th:field="*{budget}" step="0.01"
                        th:classappend="${#fields.hasErrors('budget')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')"
                        placeholder="Inserisci il budget">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></span>
                </div>

                <div class="mb-3">
                    <label for="startDate" class="form-label">Data di inizio</label>
                    <input type="date" class="form-control" id="startDate" th:field="*{startDate}"
                        th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}">
                    </span>
                </div>

                <div class="mb-3">
                    <label for="endDate" class="form-label">Data di fine</label>
                    <input type="date" class="form-control" id="endDate" th:field="*{endDate}"
                        th:classappend="${#fields.hasErrors('endDate') || #fields.hasErrors('endDateAfterStartDate') ? 'is-invalid' : (#fields.hasAnyErrors() ? 'is-valid' : '')}">

                    <span class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}">
                    </span>
                    <span th:if="${#fields.hasErrors('endDateAfterStartDate')}" th:errors="*{endDateAfterStartDate}"
                        class="invalid-feedback"></span>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary"
                        th:text="${project.id == null} ? 'Aggiungi' : 'Modifica'">

                    </button>
                </div>
            </form>

        </div>

    </main>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Show pass -->
    <script th:src="@{/js/show-pass.js}"></script>

</body>

</html>
