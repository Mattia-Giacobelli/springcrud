<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <title>Assegnazione Dipendenti</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid gap-5">
                <a class="navbar-brand" href="#">Azienda</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects">Dipendenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/projects">Progetti</a>
                        </li>

                    </ul>
                </div>
            </div>

            <div class="d-flex justify-content-end me-4">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse navbar-dark" id="navbarSupportedContent">
                    <!-- Right Side Of Navbar -->
                    <ul class="navbar-nav navbar-dark bg-dark ml-auto">
                        <!-- Authentication Links -->

                        <!-- SE L'UTENTE NON È AUTENTICATO (Corrisponde a @guest) -->
                        <th:block sec:authorize="!isAuthenticated()">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/login}">Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/register}">Register</a>
                            </li>
                        </th:block>

                        <!-- SE L'UTENTE È AUTENTICATO (Corrisponde a @else) -->
                        <th:block sec:authorize="isAuthenticated()">
                            <li class="nav-item dropdown">
                                <a id="navbarDropdown" class="nav-link dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <span sec:authentication="name">Username</span>
                                </a>

                                <div class="dropdown-menu dropdown-menu-dark dropdown-menu-right"
                                    aria-labelledby="navbarDropdown">
                                    <a class="btn btn-dark" th:href="@{/user/profile}">
                                        <span>Profilo</span>
                                    </a>
                                    <form id="logout-form" th:action="@{/logout}" method="POST">
                                        <button class="btn btn-dark" type="submit">
                                            Logout
                                        </button>
                                    </form>
                                </div>
                            </li>
                        </th:block>

                    </ul>
                </div>
            </div>

        </nav>

    </header>

    <main>

        <div class="container">

            <a class="btn btn-primary mt-5" href="/projects">Progetti</a>

            <div class="assigned">

                <div class="d-flex justify-content-between align-items-center pt-4 pb-5">

                    <h1>Dipendenti assegnati al progetto</h1>

                </div>

                <h4 th:if="${msg != null}" class="mt-3 mb-3" th:text="${msg}">

                </h4>

                <h1 class="text-center" th:if="${#lists.isEmpty(assigned)}">
                    Nessun dipendente trovato
                </h1>

                <table class="table" th:if="${!#lists.isEmpty(assigned)}">

                    <thead>

                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Cognome</th>
                            <th scope="col">Assegnazione</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="emp: ${assigned}">
                            <th th:text="${emp.id}" scope="row"></th>
                            <td th:text="${emp.name}"></td>
                            <td th:text="${emp.surname}"></td>

                            <td>
                                <form th:action="@{/projects/management/{eid}/{pid}(eid=${emp.id}, pid=${project.id})}"
                                    th:method="delete">
                                    <button type="submit" class="btn btn-danger">
                                        Rimuovi
                                    </button>
                                </form>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="unassigned">

                <div class="d-flex justify-content-between align-items-center pt-4 pb-5">

                    <h1>Dipendenti non assegnati al progetto</h1>

                </div>

                <h4 th:if="${msg != null}" class="mt-3 mb-3" th:text="${msg}">

                </h4>

                <h1 class="text-center" th:if="${#lists.isEmpty(unassigned)}">
                    Nessun dipendente trovato
                </h1>

                <table class="table" th:if="${!#lists.isEmpty(unassigned)}">

                    <thead>

                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Cognome</th>
                            <th scope="col">Assegnazione</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="emp: ${unassigned}">
                            <th th:text="${emp.id}" scope="row"></th>
                            <td th:text="${emp.name}"></td>
                            <td th:text="${emp.surname}"></td>

                            <td>
                                <form th:action="@{/projects/management/{eid}/{pid}(eid=${emp.id}, pid=${project.id})}"
                                    method="post">
                                    <button type="submit" class="btn btn-success">
                                        Aggiungi
                                    </button>
                                </form>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
