<!DOCTYPE html>
<html lang="it" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <title>Dipendenti</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid gap-5">
                <a class="navbar-brand" href="#">Azienda</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/employees">Dipendenti</a>
                        </li>

                    </ul>
                </div>
            </div>

            <div class="d-flex justify-content-end me-4">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse navbar-dark" id="navbarSupportedContent">
                    <!-- Right Side Of Navbar -->
                    <ul class="navbar-nav navbar-dark bg-dark ml-auto">
                        <!-- Authentication Links -->

                        <!-- SE L'UTENTE NON È AUTENTICATO (Corrisponde a @guest) -->
                        <th:block sec:authorize="!isAuthenticated()">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/login}">Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/register}">Register</a>
                            </li>
                        </th:block>

                        <!-- SE L'UTENTE È AUTENTICATO (Corrisponde a @else) -->
                        <th:block sec:authorize="isAuthenticated()">
                            <li class="nav-item dropdown">
                                <a id="navbarDropdown" class="nav-link dropdown-toggle" href="#" role="button"
                                    data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                    <span sec:authentication="name">Username</span>
                                </a>

                                <div class="dropdown-menu dropdown-menu-dark dropdown-menu-right"
                                    aria-labelledby="navbarDropdown">
                                    <form id="logout-form" th:action="@{/logout}" method="POST">
                                        <button class="btn btn-dark" type="submit">
                                            Logout
                                        </button>
                                    </form>
                                </div>
                            </li>
                        </th:block>

                    </ul>
                </div>
            </div>

        </nav>

    </header>

    <main>

        <div class="container">

            <div class="d-flex justify-content-between align-items-center pt-4 pb-5">

                <h1>Dipendenti</h1>

                <form action="/employees" method="get">

                    <div class="input-group">
                        <input type="text" name="email" id="search-email" placeholder="Cerca per email">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>

                </form>

                <form action="/employees" method="get">

                    <div class="input-group">
                        <input type="number" name="age" id="search-age" placeholder="Cerca per eta" required>
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>

                </form>

                <a href="/employees/create" class="btn btn-primary">
                    Aggiungi dipendente
                </a>

            </div>

            <h4 th:if="${msg != null}" class="mt-3 mb-3" th:text="${msg}">

            </h4>

            <h1 class="text-center" th:if="${employees.size == 0}">
                Nessun dipendente trovato
            </h1>

            <h1 class="text-center" th:if="${employees.size == 0}">
                <a class="btn btn-primary" href="/employees">
                    Mostra tutti
                </a>
            </h1>

            <table class="table" th:if="${employees.size > 0}">

                <thead>

                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Cognome</th>
                        <th scope="col">Data di Nascita</th>
                        <th scope="col">Codice Fiscsale</th>
                        <th scope="col">Ruolo</th>
                        <th scope="col">Salario</th>
                        <th scope="col">Data di assunzione</th>
                        <th scope="col">Username</th>
                        <th scope="col">Email</th>
                        <th scope="col">Password</th>
                        <th scope="col">Permesso</th>
                        <th scope="col">Azioni</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="employee: ${employees}">
                        <th th:text="${employee.id}" scope="row"></th>
                        <td th:text="${employee.name}"></td>
                        <td th:text="${employee.surname}"></td>
                        <td th:text="${#temporals.format(employee.birthDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${employee.fiscalCode}"></td>
                        <td th:text="${employee.role}"></td>
                        <td th:text="${employee.salary} + '€'"></td>
                        <td th:text="${#temporals.format(employee.hiringDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="${employee.user.username}"></td>
                        <td th:text="${employee.user.email}"></td>
                        <td th:text="${employee.user != null} ? '*********' : 'N/D'"></td>
                        <td th:text="${employee.user.permission.permissionType}"></td>

                        <td>
                            <a th:href="@{/employees/update/{id}(id=${employee.id})}"
                                class="btn btn-warning">Modifica</a>
                            <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                                th:data-bs-target="'#deleteModal' + ${employee.id}">
                                Elimina
                            </button>
                        </td>

                        <!-- Modal -->
                        <div class="modal fade" th:id="'deleteModal' + ${employee.id}" tabindex="-1"
                            aria-labelledby="deleteModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-5" id="deleteModalLabel">Modal title</h1>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body"
                                        th:text="'Sei sicuro di voler eliminare' + ${employee.name} + ' ' + ${employee.surname} + '?'">

                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Annulla</button>
                                        <form th:action="@{/employees/(id=${employee.id})}" th:method="delete">
                                            <button type="submit" class="btn btn-danger">Elimina</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </tr>

                    <tr th:if="${id!=null}">
                        <th scope="row" th:text="${id}"></th>
                        <td th:text="${msg}"></td>
                    </tr>

                </tbody>

            </table>


        </div>

    </main>

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
